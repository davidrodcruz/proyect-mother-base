name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin: action-setup reads "packageManager" from package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin: action-setup reads "packageManager" from package.json
      # (pnpm@11.6.0). pnpm 8 could not read lockfileVersion 9.0, which made
      # `pnpm install --frozen-lockfile` fail with ERR_PNPM_NO_LOCKFILE.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin: action-setup reads "packageManager" from package.json
      # (pnpm@11.6.0). pnpm 8 could not read lockfileVersion 9.0, which made
      # `pnpm install --frozen-lockfile` fail with ERR_PNPM_NO_LOCKFILE.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
